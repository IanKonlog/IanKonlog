<svg xmlns="http://www.w3.org/2000/svg" width="480" height="414" viewBox="0 0 480 414" role="img" aria-label="Public GitHub profile statistics">
<style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #57606a; }
      .surface { fill: #f6f8fa; stroke: #d0d7de; }
      .title { fill: #24292f; font-size: 22px; font-weight: 700; }
      .heading { fill: #0969da; font-size: 16px; font-weight: 600; }
      .value { fill: #24292f; font-weight: 700; }
      .row { font-size: 14px; }
      .note { font-size: 12px; }
      .rule { stroke: #d0d7de; }
      @media (prefers-color-scheme: dark) {
        text { fill: #8b949e; }
        .surface { fill: #0d1117; stroke: #30363d; }
        .title, .value { fill: #e6edf3; }
        .heading { fill: #58a6ff; }
        .rule { stroke: #30363d; }
      }
    </style>
<rect class="surface" x="0.5" y="0.5" width="479" height="413" rx="10" />
<text class="title" x="18" y="30">Roger Ian Konlog</text>
<text class="note" x="18" y="49">On GitHub for 5 years · Public profile data</text>
<line class="rule" x1="18" y1="62" x2="462" y2="62" />
<text class="heading" x="18" y="88">Activity</text>
<text class="row" x="18" y="115"><tspan class="value">2,931</tspan> contributions past year</text>
<text class="row" x="18" y="139"><tspan class="value">12</tspan> public pull requests</text>
<text class="row" x="18" y="163"><tspan class="value">0</tspan> public issues</text>
<text class="heading" x="250" y="88">Community</text>
<text class="row" x="250" y="115"><tspan class="value">0</tspan> followers</text>
<text class="row" x="250" y="139"><tspan class="value">0</tspan> following</text>
<text class="row" x="250" y="163"><tspan class="value">8</tspan> repositories starred</text>
<line class="rule" x1="18" y1="181" x2="462" y2="181" />
<text class="heading" x="18" y="208">Public repositories</text>
<text class="row" x="18" y="235"><tspan class="value">7</tspan> repositories</text>
<text class="row" x="250" y="235"><tspan class="value">3</tspan> original projects</text>
<text class="row" x="18" y="259"><tspan class="value">4</tspan> forks</text>
<text class="row" x="250" y="259"><tspan class="value">0</tspan> stars earned</text>
<line class="rule" x1="18" y1="278" x2="462" y2="278" />
<text class="heading" x="18" y="305">Lines of code</text>
<text class="row" x="18" y="332"><tspan class="value">12,180</tspan> nonblank source lines</text>
<text class="row" x="18" y="356"><tspan class="value">13,990</tspan> lines added</text>
<text class="row" x="250" y="356"><tspan class="value">684</tspan> lines removed</text>
<line class="rule" x1="18" y1="373" x2="462" y2="373" />
<text class="note" x="18" y="393">Source lines are current; changes span Git history.</text>
<text class="note" x="18" y="407">Only original public repositories are counted.</text>
</svg>
