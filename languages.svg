<svg xmlns="http://www.w3.org/2000/svg" width="480" height="203" viewBox="0 0 480 203" role="img" aria-label="Languages in original public repositories">
<style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #57606a; }
      .surface { fill: #f6f8fa; stroke: #d0d7de; }
      .title { fill: #24292f; font-size: 22px; font-weight: 700; }
      .heading { fill: #0969da; font-size: 16px; font-weight: 600; }
      .value { fill: #24292f; font-weight: 700; }
      .row { font-size: 14px; }
      .note { font-size: 12px; }
      .rule { stroke: #d0d7de; }
      @media (prefers-color-scheme: dark) {
        text { fill: #8b949e; }
        .surface { fill: #0d1117; stroke: #30363d; }
        .title, .value { fill: #e6edf3; }
        .heading { fill: #58a6ff; }
        .rule { stroke: #30363d; }
      }
    </style>
<rect class="surface" x="0.5" y="0.5" width="479" height="202" rx="10" />
<text class="heading" x="18" y="27">Languages in public projects</text>
<text class="note" x="18" y="46">By code size across 3 original repositories</text>
<defs><clipPath id="bar"><rect x="18" y="61" width="444" height="14" rx="7" /></clipPath></defs>
<g clip-path="url(#bar)">
<rect x="18.00" y="61" width="399.97" height="14" fill="#3178c6" />
<rect x="417.96" y="61" width="18.87" height="14" fill="#3572a5" />
<rect x="436.82" y="61" width="15.71" height="14" fill="#f1e05a" />
<rect x="452.52" y="61" width="5.09" height="14" fill="#563d7c" />
<rect x="457.60" y="61" width="1.92" height="14" fill="#e34c26" />
<rect x="459.51" y="61" width="1.49" height="14" fill="#89e051" />
<rect x="460.99" y="61" width="1.02" height="14" fill="#8b949e" />
</g>
<circle cx="24" cy="96" r="5" fill="#3178c6" />
<text class="row" x="36" y="101">TypeScript 90%</text>
<circle cx="249" cy="96" r="5" fill="#3572a5" />
<text class="row" x="261" y="101">Python 4%</text>
<circle cx="24" cy="119" r="5" fill="#f1e05a" />
<text class="row" x="36" y="124">JavaScript 4%</text>
<circle cx="249" cy="119" r="5" fill="#563d7c" />
<text class="row" x="261" y="124">CSS 1%</text>
<circle cx="24" cy="142" r="5" fill="#e34c26" />
<text class="row" x="36" y="147">HTML 0.4%</text>
<circle cx="249" cy="142" r="5" fill="#89e051" />
<text class="row" x="261" y="147">Shell 0.3%</text>
<circle cx="24" cy="165" r="5" fill="#8b949e" />
<text class="row" x="36" y="170">Other 0.2%</text>
<text class="note" x="18" y="196">Private repositories and forks excluded.</text>
</svg>
