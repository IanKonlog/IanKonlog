name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/New_York
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate public profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_public_cards.py
      - name: Publish public profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update public profile cards - [Skip GitHub Action]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
